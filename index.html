<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simple Alarm</title>
    <style>
        :root {
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        body {
            margin: 0;
            padding: 24px;
            display: grid;
            place-items: center;
            min-height: 100vh;
        }

        .card {
            width: min(520px, 92vw);
            border: 1px solid #ddd;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, .06);
        }

        h1 {
            font-size: 18px;
            margin: 0 0 12px;
        }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        input,
        button {
            font-size: 16px;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid #ccc;
        }

        button {
            cursor: pointer;
            border: 1px solid #bbb;
            background: #f7f7f7;
        }

        button.primary {
            background: #111;
            color: #fff;
            border-color: #111;
        }

        button.danger {
            background: #fff5f5;
            border-color: #f2b8b8;
        }

        .time {
            font-variant-numeric: tabular-nums;
            font-size: 48px;
            margin: 14px 0 8px;
        }

        .status {
            color: #666;
            margin: 0 0 12px;
        }

        .hint {
            color: #666;
            font-size: 13px;
            margin-top: 12px;
            line-height: 1.5;
        }

        .flash {
            animation: flash 0.25s alternate infinite;
        }

        @keyframes flash {
            from {
                background: #fff;
            }

            to {
                background: #fff2cc;
            }
        }
    </style>
</head>

<body>
    <div class="card" id="card">
        <h1>Simple Alarm（潜っていい時間を区切る）</h1>

        <div class="row">
            <label>
                分：
                <input id="minutes" type="number" min="1" step="1" value="25" inputmode="numeric" />
            </label>

            <button class="primary" id="start">Start</button>
            <button id="pause">Pause</button>
            <button class="danger" id="reset">Reset</button>
        </div>

        <div class="time" id="display">25:00</div>
        <p class="status" id="status">待機中</p>

        <div class="hint">
            使い方：<br>
            - 「Start」でカウント開始（音が鳴る権限もここで確保）<br>
            - 終了したら画面が点滅＋短いビープ音を数回<br>
            - タブを閉じても“思考の錨”として使えるように超軽量にしてある
        </div>
    </div>

    <script>
        (() => {
            const $ = (id) => document.getElementById(id);
            const minutesEl = $("minutes");
            const displayEl = $("display");
            const statusEl = $("status");
            const cardEl = $("card");

            const startBtn = $("start");
            const pauseBtn = $("pause");
            const resetBtn = $("reset");

            let totalMs = 25 * 60 * 1000;
            let remainingMs = totalMs;
            let timerId = null;
            let endAt = null;
            let paused = false;
            let audioCtx = null;
            let titleBase = document.title;
            let titleBlinkId = null;
            let warned = false; // ★追加：1分前ビープ済みか


            function pad2(n) { return String(n).padStart(2, "0"); }

            function format(ms) {
                ms = Math.max(0, ms);
                const s = Math.floor(ms / 1000);
                const m = Math.floor(s / 60);
                const r = s % 60;
                return `${pad2(m)}:${pad2(r)}`;
            }

            function setStatus(text) { statusEl.textContent = text; }

            function updateDisplay() {
                displayEl.textContent = format(remainingMs);
            }

            function stopTimer() {
                if (timerId) clearInterval(timerId);
                timerId = null;
                endAt = null;
                paused = false;
            }

            function ensureAudio() {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                // iOS等: resumeが必要なことがある
                if (audioCtx.state === "suspended") audioCtx.resume();
            }

            function beep(durationMs = 180, freq = 880) {
                if (!audioCtx) return;
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = "sine";
                o.frequency.value = freq;
                g.gain.value = 0.08;
                o.connect(g); g.connect(audioCtx.destination);
                o.start();
                setTimeout(() => { o.stop(); }, durationMs);
            }

            function startTitleBlink() {
                if (titleBlinkId) return;
                let on = false;
                titleBlinkId = setInterval(() => {
                    on = !on;
                    document.title = on ? "⏰ TIME UP" : titleBase;
                }, 500);
            }

            function stopTitleBlink() {
                if (titleBlinkId) clearInterval(titleBlinkId);
                titleBlinkId = null;
                document.title = titleBase;
            }

            function timeUp() {
                stopTimer();
                cardEl.classList.add("flash");
                setStatus("時間です（浮上）");
                startTitleBlink();

                let count = 0;
                const seq = setInterval(() => {
                    count++;
                    beep(220, 1000);      // ★ 高め
                    setTimeout(() => beep(180, 800), 260);
                    if (count >= 6) clearInterval(seq);
                }, 700);
            }

            function tick() {
                if (!endAt) return;

                remainingMs = endAt - Date.now();
                updateDisplay();

                // ★ 1分前予告（1回だけ）
                if (!warned && remainingMs <= 60 * 1000 && remainingMs > 0) {
                    warned = true;
                    setStatus("あと1分");
                    beep(120, 440); // 低め・短め
                }

                if (remainingMs <= 0) timeUp();
            }


            function applyMinutes() {
                const m = Math.max(1, Math.floor(Number(minutesEl.value || 25)));
                totalMs = m * 60 * 1000;
                remainingMs = totalMs;
                updateDisplay();
            }

            minutesEl.addEventListener("change", () => {
                if (timerId) return; // 実行中は変更不可（シンプル優先）
                applyMinutes();
            });

            startBtn.addEventListener("click", () => {
                // すでに動いてたら無視
                if (timerId && !paused) return;

                // 終了フラッシュ解除
                cardEl.classList.remove("flash");
                stopTitleBlink();

                ensureAudio();
                beep(80, 660); // 開始の合図

                if (!timerId) {
                    // 新規開始
                    warned = false; // ★ ここでリセット
                    endAt = Date.now() + remainingMs;
                    timerId = setInterval(tick, 200);
                    setStatus("実行中");
                    paused = false;
                    pauseBtn.textContent = "Pause";
                    return;
                }

                // Pause中から復帰
                endAt = Date.now() + remainingMs;
                paused = false;
                setStatus("実行中");
                pauseBtn.textContent = "Pause";
            });

            pauseBtn.addEventListener("click", () => {
                if (!timerId && !paused) return;

                // 実行中→一時停止
                if (timerId && !paused) {
                    clearInterval(timerId);
                    timerId = null;
                    remainingMs = Math.max(0, endAt - Date.now());
                    paused = true;
                    setStatus("一時停止中");
                    pauseBtn.textContent = "Resume";
                    beep(70, 520);
                    return;
                }

                // 一時停止中→Start押して復帰（Pauseボタンでも復帰させたい）
                if (!timerId && paused) {
                    startBtn.click();
                }
            });

            resetBtn.addEventListener("click", () => {
                stopTimer();
                paused = false;
                warned = false; // ★ ここ
                stopTitleBlink();
                cardEl.classList.remove("flash");
                applyMinutes();
                setStatus("待機中");
                pauseBtn.textContent = "Pause";
                // リセット音（任意）
                if (audioCtx) beep(60, 440);
            });

            // 初期表示
            applyMinutes();
        })();
    </script>
</body>

</html>
